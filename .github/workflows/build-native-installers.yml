name: Build native installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple Silicon
            artifact: remixer-macos-arm64
            files: |
              release/Remixer-*-arm64.dmg
              release/Remixer-*-arm64.zip
          - os: windows-latest
            label: Windows x64
            artifact: remixer-windows-x64
            files: release/Remixer-Setup-*-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared application
        run: npm run typecheck && npm test

      - name: Build native package
        run: npm run package

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          check_dir="$RUNNER_TEMP/remixer-signature-check"
          mkdir -p "$check_dir"
          ditto -x -k "release/Remixer-${version}-arm64.zip" "$check_dir"
          codesign --verify --deep --strict --verbose=2 "$check_dir/Remixer.app"

      - name: Upload native installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
